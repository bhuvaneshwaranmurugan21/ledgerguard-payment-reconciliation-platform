name: Part 3 Stage 2 Bounded Recovery Cleanup

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact immutable failed-run main commit
        required: true
        type: string
      failed_run_id:
        description: Failed capability run ID
        required: true
        type: string
      failed_run_attempt:
        description: Failed capability run attempt
        required: true
        type: string
      failed_artifact_id:
        description: Failed capability artifact ID
        required: true
        type: string
      failed_artifact_sha256:
        description: SHA-256 of the failed capability artifact ZIP
        required: true
        type: string
      failed_inspection_sha256:
        description: SHA-256 of the failed capability inspection report
        required: true
        type: string
      journal_sha256:
        description: SHA-256 of the failed run mutation journal
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: ledgerguard-part3-stage2-${{ github.repository }}
  cancel-in-progress: false

jobs:
  recover-exact-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      CHECKED_OUT_SHA: ${{ inputs.expected_sha }}
      FAILED_RUN_ID: ${{ inputs.failed_run_id }}
      FAILED_RUN_ATTEMPT: ${{ inputs.failed_run_attempt }}
      FAILED_ARTIFACT_ID: ${{ inputs.failed_artifact_id }}
      FAILED_ARTIFACT_SHA256: ${{ inputs.failed_artifact_sha256 }}
      FAILED_INSPECTION_SHA256: ${{ inputs.failed_inspection_sha256 }}
      FAILED_JOURNAL_SHA256: ${{ inputs.journal_sha256 }}
    steps:
      - name: Check out exact failed-run commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - name: Install exact Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11.13"
          cache: pip
          cache-dependency-path: |
            requirements/part2-stage8-bootstrap.lock
            requirements/part2-stage8-py311.lock
      - name: Reject unbounded recovery before OIDC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ledgerguard-part3-stage2-recovery"
          test "${{ github.event_name }}" = "workflow_dispatch"
          test "${{ github.repository }}" = "bhuvaneshwaranmurugan21/ledgerguard-payment-reconciliation-platform"
          test "${{ github.ref }}" = "refs/heads/main"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "${{ github.sha }}" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$AWS_REGION" = "ap-southeast-2"
          test "$AWS_ROLE_ARN" = "arn:aws:iam::857229544428:role/LedgerGuardGitHubOidcRole"
          [[ "$FAILED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$FAILED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$FAILED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$FAILED_ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FAILED_INSPECTION_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FAILED_JOURNAL_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - name: Install locked qualification package
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/part2-stage8-bootstrap.lock
          python -m pip install --require-hashes -r requirements/part2-stage8-py311.lock
          python -m pip install --no-deps .
      - name: Bind failed mutation journal before OIDC
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/ledgerguard-part3-stage2-failed-source"
          mkdir -p "$source_dir"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN_ID" > "$source_dir/run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$FAILED_ARTIFACT_ID" > "$source_dir/metadata.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$FAILED_ARTIFACT_ID/zip" > "$source_dir/artifact.zip"
          python tools/part3_stage2_extract_artifact.py \
            --metadata "$source_dir/metadata.json" \
            --archive "$source_dir/artifact.zip" \
            --expected-artifact-id "$FAILED_ARTIFACT_ID" \
            --expected-run-id "$FAILED_RUN_ID" \
            --expected-name "ledgerguard-part3-stage2-capability-$EXPECTED_SHA-$FAILED_RUN_ID" \
            --expected-archive-sha256 "$FAILED_ARTIFACT_SHA256" \
            --output "$source_dir/extracted"
          python tools/part3_stage2_inspect_artifact.py \
            --artifact "$source_dir/extracted" \
            --expected-sha "$EXPECTED_SHA" \
            --expected-run-id "$FAILED_RUN_ID" \
            --expected-run-attempt "$FAILED_RUN_ATTEMPT" \
            --expected-classification CAPABILITY_PROBE \
            --expected-state FAILED \
            --run-metadata "$source_dir/run.json" \
            --expected-workflow-path .github/workflows/part3-stage2-capability.yml \
            --expected-conclusion-class FAILED_TERMINAL \
            --artifact-id "$FAILED_ARTIFACT_ID" \
            --artifact-zip-sha256 "$FAILED_ARTIFACT_SHA256" \
            --expected-journal-sha256 "$FAILED_JOURNAL_SHA256" \
            --output "$source_dir/inspection.json"
          test "$(sha256sum "$source_dir/inspection.json" | cut -d ' ' -f 1)" = "$FAILED_INSPECTION_SHA256"
      - name: Assume exact repository OIDC role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ledgerguard-stage2-recovery-${{ github.run_id }}
          role-duration-seconds: 1800
          mask-aws-account-id: true
      - name: Clean only resources derived from failed run identity
        run: >-
          python tools/part3_stage2_live.py recovery
          --expected-sha "$EXPECTED_SHA"
          --failed-run-id "$FAILED_RUN_ID"
          --failed-run-attempt "$FAILED_RUN_ATTEMPT"
          --failed-artifact-id "$FAILED_ARTIFACT_ID"
          --journal-sha256 "$FAILED_JOURNAL_SHA256"
          --output "$RUNNER_TEMP/ledgerguard-part3-stage2-recovery"
      - name: Upload recovery and absence evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ledgerguard-part3-stage2-recovery-${{ inputs.expected_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ledgerguard-part3-stage2-recovery
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
