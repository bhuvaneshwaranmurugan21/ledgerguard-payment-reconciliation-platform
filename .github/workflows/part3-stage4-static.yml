name: Part 3 Stage 4 static qualification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: part3-stage4-static-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    strategy:
      fail-fast: false
      matrix:
        qualification: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CHECKPOINT_DISABLE: "1"
    steps:
      - name: Check out exact event head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11.13"
      - name: Download the immutable accepted Stage 3 rehearsal evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 10147923228
          run-id: 34465749986
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/stage4-accepted-ci
          merge-multiple: true
      - name: Install hash-locked qualification dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/part3-stage3-bootstrap.lock
          python -m pip install --require-hashes -r requirements/part3-stage3-py311.lock
          python -m pip install --require-hashes -r requirements/part3-stage4-parser.lock
      - name: Install verified Terraform and TFLint
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/ledgerguard-stage4-tools"
          mkdir -p "$tool_dir"
          curl --fail --location --retry 3 https://releases.hashicorp.com/terraform/1.13.1/terraform_1.13.1_linux_amd64.zip --output "$tool_dir/terraform.zip"
          curl --fail --location --retry 3 https://github.com/terraform-linters/tflint/releases/download/v0.59.1/tflint_linux_amd64.zip --output "$tool_dir/tflint.zip"
          python - "$tool_dir" <<'PY'
          import hashlib
          import sys
          import zipfile
          from pathlib import Path
          root = Path(sys.argv[1])
          for name, expected in [
              ('terraform', '4449e2ddc0dee283f0909dd603eaf98edeebaa950f4635cea94f2caf0ffacc5a'),
              ('tflint', '6108d84282292f11d793dc8038ce08fbc629dcd25324d6f13c63d8100b52e01f'),
          ]:
              raw = (root / (name + '.zip')).read_bytes()
              if hashlib.sha256(raw).hexdigest() != expected:
                  raise SystemExit(name + ' archive digest mismatch')
              with zipfile.ZipFile(root / (name + '.zip')) as archive:
                  (root / name).write_bytes(archive.read(name))
              (root / name).chmod(0o755)
          PY
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Reproduce the immutable accepted runtime from frozen source
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m tools.validate_part3_stage4_handoff
          python tools/build_part3_stage3_runtime.py --repository . --environment "$pythonLocation" --output "$RUNNER_TEMP/stage4-accepted-runtime" --source-commit 3370898d83539fe41594c7cb7ad15e920dcb5674 --source-tree 32e66b9d97cc63cd588eca14ecaf6602b9ff7f0a --source-date-epoch 1789035768
          python - "$RUNNER_TEMP/stage4-accepted-runtime/ledgerguard-stage3-glue-runtime.zip" <<'PYTHON'
          from hashlib import sha256
          from pathlib import Path
          import sys
          if sha256(Path(sys.argv[1]).read_bytes()).hexdigest() != "12a263615abeeea33a6202ecc49d9fe27606fe1c2b37650f25ba9adebcb7b7f7":
              raise SystemExit("accepted Stage 3 runtime bytes did not reproduce")
          PYTHON
          echo "STAGE4_ACCEPTED_RUNTIME=$RUNNER_TEMP/stage4-accepted-runtime/ledgerguard-stage3-glue-runtime.zip" >> "$GITHUB_ENV"
      - name: Install the pinned security scanner
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/ledgerguard-stage4-tools"
          curl --fail --location --retry 3 https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz --output "$tool_dir/trivy.tar.gz"
          python - "$tool_dir" <<'PYTHON'
          from hashlib import sha256
          from pathlib import Path
          import sys, tarfile
          root = Path(sys.argv[1])
          if sha256((root / "trivy.tar.gz").read_bytes()).hexdigest() != "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a":
              raise SystemExit("Trivy archive identity differs")
          with tarfile.open(root / "trivy.tar.gz") as archive:
              member = archive.extractfile("trivy")
              if member is None:
                  raise SystemExit("Trivy executable missing")
              (root / "trivy").write_bytes(member.read())
          (root / "trivy").chmod(0o755)
          PYTHON
      - name: Run required real static checks
        env:
          STAGE4_EVIDENCE: ${{ runner.temp }}/part3-stage4-static
          STAGE4_ACCEPTED_CI_ARTIFACT: ${{ runner.temp }}/stage4-accepted-ci
        run: >-
          python -m coverage run --rcfile=spec/part3-stage4-coverage.ini
          --data-file="$RUNNER_TEMP/.coverage.stage4-native"
          -m tools.run_part3_stage4_static
      - name: Require complete coverage of controls and qualification machinery
        if: always()
        env:
          STAGE4_EVIDENCE: ${{ runner.temp }}/part3-stage4-static
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP"/.coverage.stage4-native.* "$STAGE4_EVIDENCE/"
          python -m coverage combine --rcfile=spec/part3-stage4-coverage.ini --append --keep --data-file="$STAGE4_EVIDENCE/.coverage.critical" "$STAGE4_EVIDENCE" "$STAGE4_EVIDENCE"/.coverage.stage4-native.*
          python -m coverage json --rcfile=spec/part3-stage4-coverage.ini --data-file="$STAGE4_EVIDENCE/.coverage.critical" -o "$STAGE4_EVIDENCE/critical-coverage.json"
          python -m coverage report --rcfile=spec/part3-stage4-coverage.ini --data-file="$STAGE4_EVIDENCE/.coverage.critical" --fail-under=100
      - name: Preserve evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: part3-stage4-static-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}-${{ matrix.qualification }}
          path: ${{ runner.temp }}/part3-stage4-static
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
