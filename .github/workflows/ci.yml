      - name: Prove and materialize immutable Part 2 Stage 8 promotion closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show -s --format=%T "$PART2_STAGE8_PROMOTION_SHA")" = "406f40dfb1e94e38031505e23a6d77b50198840f"
          test "$(git show -s --format=%P "$PART2_STAGE8_PROMOTION_SHA")" = "8fac3795ed0dac5284dd3b1595bd8fc9f6dc7344"
          python - <<'PY'
          import hashlib
