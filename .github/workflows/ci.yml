      - name: Prove and materialize immutable Part 2 Stage 5 closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show -s --format=%T "$PART2_STAGE5_CLOSURE_SHA")" = "41bdd1fb8209f44dbbc21a5737f0e28eebab904b"
          test "$(git show -s --format=%P "$PART2_STAGE5_CLOSURE_SHA")" = "c423ae7e6e92d37ffa8a796b4efacbf9ba6692f1"
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          closure = os.environ["PART2_STAGE5_CLOSURE_SHA"]
          freeze = json.loads((root / "spec/part2-stage5-closure-freeze-v1.json").read_text())
          assert freeze["squash_merge_commit"] == closure
          for relative, expected in freeze["protected_authorities"].items():
              frozen = subprocess.check_output(["git", "show", f"{closure}:{relative}"])
              current = (root / relative).read_bytes()
              assert hashlib.sha256(frozen).hexdigest() == expected
              assert current == frozen
          PY
          git worktree add --detach "$RUNNER_TEMP/ledgerguard-part2-stage5-closure" "$PART2_STAGE5_CLOSURE_SHA"
      - name: Run complete Stage 6 validation twice
        run: >-
          python "$RUNNER_TEMP/ledgerguard-part1-closure/tools/run_part1_stage6.py"
          --clean-runs 2
          --output "$RUNNER_TEMP/ledgerguard-stage6"
      - name: Validate Stage 7 promotion candidate
        working-directory: ${{ runner.temp }}/ledgerguard-part1-closure
        run: >-
          "$RUNNER_TEMP/ledgerguard-stage6/run-1/venv/bin/python"
          -m ledgerguard_correction_c5
      - name: Run Part 2 Stage 1 validation twice
        run: >-
          python "$RUNNER_TEMP/ledgerguard-part2-stage1-closure/tools/run_part2_stage1.py"
          --clean-runs 2
          --output "$RUNNER_TEMP/ledgerguard-part2-stage1"
      - name: Build trusted CI evidence envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'part2-stage1-execution-contract'
        run: >-
          "$RUNNER_TEMP/ledgerguard-stage6/run-1/venv/bin/python"
          tools/build_part2_stage1_ci_evidence.py
          --local-evidence "$RUNNER_TEMP/ledgerguard-part2-stage1/part2-stage1-local-evidence.json"
          --output-directory "$RUNNER_TEMP/ledgerguard-part2-stage1-artifact"
      - name: Upload immutable Stage 1 evidence
        if: github.event_name == 'pull_request' && github.head_ref == 'part2-stage1-execution-contract'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ledgerguard-part2-stage1-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ledgerguard-part2-stage1-artifact
          if-no-files-found: error
          retention-days: 90
      - name: Run Part 2 Stage 2 validation twice
        working-directory: ${{ runner.temp }}/ledgerguard-part2-stage2-closure
        run: >-
          python tools/run_part2_stage2.py
          --clean-runs 2
          --output "$RUNNER_TEMP/ledgerguard-part2-stage2"
      - name: Build trusted Stage 2 CI evidence envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'part2-stage2-reference-oracle'
        run: >-
          "$RUNNER_TEMP/ledgerguard-part2-stage2/run-1/venv/bin/python"
          "$RUNNER_TEMP/ledgerguard-part2-stage2-closure/tools/build_part2_stage2_ci_evidence.py"
          --local-evidence "$RUNNER_TEMP/ledgerguard-part2-stage2/part2-stage2-local-evidence.json"
          --output-directory "$RUNNER_TEMP/ledgerguard-part2-stage2-artifact"
      - name: Upload immutable Stage 2 evidence
