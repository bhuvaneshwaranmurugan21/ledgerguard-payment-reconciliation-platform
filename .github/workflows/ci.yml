        run: |
          set -euo pipefail
          test "$(git show -s --format=%T "$PART2_STAGE4_CLOSURE_SHA")" = "f7c8bfc82ebd895f60d9ad26f35e9922b35c5de9"
          test "$(git show -s --format=%P "$PART2_STAGE4_CLOSURE_SHA")" = "47e96d3f4846d55568c0b137fb3e4d41ead0eef1"
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          closure = os.environ["PART2_STAGE4_CLOSURE_SHA"]
