        with:
          name: ledgerguard-part2-stage5-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ledgerguard-part2-stage5-artifact
          if-no-files-found: error
          retention-days: 90
      - name: Prove and materialize immutable Part 2 Stage 6 closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show -s --format=%T "$PART2_STAGE6_CLOSURE_SHA")" = "997bd12abfef144212cb6f774cdfff086d31a0ff"
          test "$(git show -s --format=%P "$PART2_STAGE6_CLOSURE_SHA")" = "89373adf968ff7071693f8cce5d12901fd9b1e69"
