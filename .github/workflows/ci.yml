name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PART1_CLOSURE_SHA: 3ef17666e3fe3bc655ba1c8733beb3cb00acdbec
      PART2_STAGE1_CLOSURE_SHA: 95b7e2a1c6a1dd758a8ce43c73bdea80117b6d91
      PART2_STAGE2_CLOSURE_SHA: 55e78f76e76bff7562d43a3d001dbb74fd66d8fd
      PART2_STAGE3_CLOSURE_SHA: 47e96d3f4846d55568c0b137fb3e4d41ead0eef1
      PART2_STAGE4_CLOSURE_SHA: c423ae7e6e92d37ffa8a796b4efacbf9ba6692f1
      PART2_STAGE5_CLOSURE_SHA: 89373adf968ff7071693f8cce5d12901fd9b1e69
      PART2_STAGE6_CLOSURE_SHA: 376e686813e6271e2d6787467a5500ba0827dfcb
      PART2_STAGE7_CLOSURE_SHA: 8fac3795ed0dac5284dd3b1595bd8fc9f6dc7344
      PART2_STAGE8_PROMOTION_SHA: 71b42d6622558093a2bfaced58724f2ab71e793e
    steps:
      - name: Check out the raw event head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install exact Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11.13"
          cache: pip
          cache-dependency-path: |
            requirements/part1-stage6-bootstrap.lock
            requirements/part1-stage6-py311.lock
            requirements/part2-stage1-bootstrap.lock
            requirements/part2-stage1-py311.lock
            requirements/part2-stage2-bootstrap.lock
            requirements/part2-stage2-py311.lock
            requirements/part2-stage3-bootstrap.lock
            requirements/part2-stage3-py311.lock
            requirements/part2-stage4-bootstrap.lock
            requirements/part2-stage4-py311.lock
            requirements/part2-stage5-bootstrap.lock
            requirements/part2-stage5-py311.lock
            requirements/part2-stage6-bootstrap.lock
            requirements/part2-stage6-py311.lock
            requirements/part2-stage7-bootstrap.lock
            requirements/part2-stage7-py311.lock
            requirements/part2-stage8-bootstrap.lock
            requirements/part2-stage8-py311.lock
      - name: Install exact Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "17"
      - name: Prove raw exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
      - name: Prove and materialize immutable Part 1 closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show -s --format=%T "$PART1_CLOSURE_SHA")" = "ffe875164eebe0d818545f3580a2085c2700d94a"
          test "$(git show -s --format=%P "$PART1_CLOSURE_SHA")" = "7151eead60e269fa5650e67d65fc8f687ddc281c"
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          closure = os.environ["PART1_CLOSURE_SHA"]
          freeze = json.loads((root / "spec/part1-stage7-closure-freeze-v1.json").read_text())
          for relative, expected in freeze["protected_authorities"].items():
              frozen = subprocess.check_output(["git", "show", f"{closure}:{relative}"])
              current = (root / relative).read_bytes()
              assert hashlib.sha256(frozen).hexdigest() == expected
              assert current == frozen
          PY
          git worktree add --detach "$RUNNER_TEMP/ledgerguard-part1-closure" "$PART1_CLOSURE_SHA"
      - name: Prove and materialize immutable Part 2 Stage 1 closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show -s --format=%T "$PART2_STAGE1_CLOSURE_SHA")" = "668e2e89473b026d9857d162fb9e45a3c8f465a1"
          test "$(git show -s --format=%P "$PART2_STAGE1_CLOSURE_SHA")" = "3ef17666e3fe3bc655ba1c8733beb3cb00acdbec"
          git worktree add --detach "$RUNNER_TEMP/ledgerguard-part2-stage1-closure" "$PART2_STAGE1_CLOSURE_SHA"
      - name: Prove and materialize immutable Part 2 Stage 2 closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show -s --format=%T "$PART2_STAGE2_CLOSURE_SHA")" = "417245f6369c3d2b08ede20c35502b612b5eb3a4"
          test "$(git show -s --format=%P "$PART2_STAGE2_CLOSURE_SHA")" = "95b7e2a1c6a1dd758a8ce43c73bdea80117b6d91"
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          closure = os.environ["PART2_STAGE2_CLOSURE_SHA"]
          freeze = json.loads((root / "spec/part2-stage2-closure-freeze-v1.json").read_text())
          assert freeze["squash_merge_commit"] == closure
          for relative, expected in freeze["protected_authorities"].items():
              frozen = subprocess.check_output(["git", "show", f"{closure}:{relative}"])
              current = (root / relative).read_bytes()
              assert hashlib.sha256(frozen).hexdigest() == expected
              assert current == frozen
          PY
          git worktree add --detach "$RUNNER_TEMP/ledgerguard-part2-stage2-closure" "$PART2_STAGE2_CLOSURE_SHA"
      - name: Prove and materialize immutable Part 2 Stage 3 closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show -s --format=%T "$PART2_STAGE3_CLOSURE_SHA")" = "a415cfc7eebafc0f512afe27cd9d3aa3418b545f"
          test "$(git show -s --format=%P "$PART2_STAGE3_CLOSURE_SHA")" = "55e78f76e76bff7562d43a3d001dbb74fd66d8fd"
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          closure = os.environ["PART2_STAGE3_CLOSURE_SHA"]
          freeze = json.loads((root / "spec/part2-stage3-closure-freeze-v1.json").read_text())
          assert freeze["squash_merge_commit"] == closure
          for relative, expected in freeze["protected_authorities"].items():
              frozen = subprocess.check_output(["git", "show", f"{closure}:{relative}"])
              current = (root / relative).read_bytes()
              assert hashlib.sha256(frozen).hexdigest() == expected
              assert current == frozen
          PY
          git worktree add --detach "$RUNNER_TEMP/ledgerguard-part2-stage3-closure" "$PART2_STAGE3_CLOSURE_SHA"
