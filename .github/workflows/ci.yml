        if: github.event_name == 'pull_request' && github.head_ref == 'part2-stage5-settlement-reconciliation'
        run: >-
          "$RUNNER_TEMP/ledgerguard-part2-stage5/run-1/venv/bin/python"
          tools/build_part2_stage5_ci_evidence.py
          --local-evidence "$RUNNER_TEMP/ledgerguard-part2-stage5/part2-stage5-local-evidence.json"
          --output-directory "$RUNNER_TEMP/ledgerguard-part2-stage5-artifact"
      - name: Upload immutable Stage 5 evidence
        if: github.event_name == 'pull_request' && github.head_ref == 'part2-stage5-settlement-reconciliation'
